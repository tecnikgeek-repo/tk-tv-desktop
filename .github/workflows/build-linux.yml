name: Build Linux

# Su richiesta (gh workflow run), come il Mac: si costruisce quando si pubblica una versione (release\publish_linux.ps1).
# Runner ubuntu-22.04: l'AppImage chiede la glibc della macchina di build e prende libVLC dai pacchetti della 22.04,
# così gira da Ubuntu 22.04 in su.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # solo sul runner (non nel pacchetto): le librerie «di base» che ogni Ubuntu desktop ha già, così il selftest
      # gira come su un PC vero, e ffmpeg per creare il video di prova. VLC NON si installa: il pacchetto deve bastare.
      - name: Prepara il runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6 libharfbuzz0b \
            libfribidi0 libdbus-1-3 libpulse0 libasound2 librsvg2-2 libcairo2 libglib2.0-0 libgnutls30 libjpeg8 \
            libpng16-16 libx11-6 libx11-xcb1 libxcb1 libxcb-xkb1 libxext6 libxfixes3 libdrm2 dbus-x11 \
            desktop-file-utils ffmpeg
          if dpkg -l | grep -E '^ii +(libvlc5|libvlccore9|vlc-plugin-base) '; then echo "VLC è installato sul runner"; exit 1; fi
      - name: Build e collaudo
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: dbus-run-session -- bash linux/build_linux.sh
      # l'AppImage va nella release del repo (lo spazio degli artifact di Actions è condiviso e si riempie);
      # la release si crea solo da main: le prove sui rami non devono comparire pubbliche
      - name: Carica l'AppImage nella release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tktv/__init__.py)"
          TAG="v$V"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "tk-tv $V" --notes "Build automatica" --target "$GITHUB_SHA" || true
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" dist/*.AppImage dist/selftest-linux-*.png dist/selftest-video-linux-*.txt --clobber && break
            sleep 8
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'
      # prove da un ramo: l'AppImage resta un giorno tra gli artifact, per provarlo su un PC vero
      - uses: actions/upload-artifact@v4
        if: success() && github.ref != 'refs/heads/main'
        continue-on-error: true
        with:
          name: appimage-prova
          path: dist/*.AppImage
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: collaudo-linux
          path: |
            dist/selftest-*
            build/appimagetool.log
            build-licenze/licenze/LINUX-PACCHETTI.txt
          retention-days: 3
          if-no-files-found: ignore
