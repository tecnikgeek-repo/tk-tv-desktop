name: Build macOS

# Solo su richiesta (gh workflow run): i minuti Mac costano 10 volte, si costruisce
# solo quando si pubblica una versione (deciso il 2026-10-11).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6, fissata al commit
      - name: Build
        run: bash mac/build_mac.sh
      # i dmg vanno nella release della versione (gli artifact hanno una quota condivisa tra i repo, spesso piena)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tktv/__init__.py)"
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --title "tk-tv $VERSION" --notes "Build Mac automatica" || true
          gh release upload "v$VERSION" dist/*.dmg dist/selftest-*.png --clobber
